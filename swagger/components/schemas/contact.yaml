type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone numbe"
    type: string
    example: '+1234567890'
  email:
    description: "Contact's email"
    type: string
    example: 'john@example.com'
  isFavourite:
    description: 'Whether the contact is marked as favourite'
    type: boolean
    example: true
  contactType:
    description: 'Type of contact'
    type: string
    enum: [work, home, personal]
    example: 'work'
  userId:
    description: 'ID of the user who owns this contact'
    type: string
    example: 65e4decdd286b30065d54af9
  photo:
    description: "Link to contact's photo"
    type: string
    example: 'https://res.cloudinary.com/demo/image/upload/sample.jpg'
  createdAt:
    type: string
    format: date-time
    example: '2025-07-14T12:34:56.789Z'
  updatedAt:
    type: string
    format: date-time
    example: '2025-07-14T12:35:56.789Z'
